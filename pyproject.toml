[project]
name = "plumb"
version = "0.1.1019"
description = "Keep a coding agent's work aligned with the owner's intent, grounded in the project's own records."
readme = "README.md"
authors = [
    { name = "Colin AUBE", email = "col1.aube@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
video = ["manim>=0.19"]   # video studies only (SR-380)

[project.scripts]
plumb = "plumb.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sr(id): links a test to a plumb requirement",
           "jev_live: calls the live JEV service; skipped unless its credential is set",
           "load_bound: asserts a time budget; waits for a free CPU, a miss is reported load-bound"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]
