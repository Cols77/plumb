# iaso configuration. Every key is optional; the defaults are shown commented out.
# A list given here replaces the default list.
# source_dirs: [src, tests]
# test_dirs: [tests]
# verify:
#   turn_budget_s: 60
#   hard_limit_factor: 1.5
#   fill_fraction: 0.65        # estimates (scaled by observed pace) fill 65 % of the budget
#   sample_size: 10
#   default_test_s: 1.0
#   workers: 0                 # 0 = no -n; at most 2
#   flaky_rerun: true
#   infra_globs: ["**/conftest.py", pyproject.toml, uv.lock, pytest.ini, tox.ini, setup.cfg]
# hooks:
#   hard_limit_s: 90   # the watchdog cuts a hook here; at most 119 (host timeouts 120 s minus the stop grace)
#   budget_ms: {session_start: 60000, prompt: 60000, stop: 60000, post_edit: 15000}
#   brief_lines: 30
#   prompt_lines: 20
#   summary_proposed_cap: 3    # records shown in full per summary
# approve:
#   affirmations: [ok, okay, yes, approve, approved, confirm, confirmed, agreed, lgtm,
#                  go ahead, sounds good]
# judgment:
#   backend: heuristic         # heuristic | jev | disabled
#   hook_timeout_ms: 5000
# escalation: {max_requirements: 3, max_features: 1, diff_lines: 400, diff_files: 10}
# trace:
#   exempt: []                 # source globs that need no requirement (untraced changes)
# freeze: []                 # parts that count in no drift, brief or merge hold (SR-380); one
#                            # naming codex or hermes wakes when that host is the agent

# iaso's own repository: its pytest plugin is shared test infrastructure too (plan 4.1).
verify:
  infra_globs: ["**/conftest.py", pyproject.toml, uv.lock, pytest.ini, tox.ini, setup.cfg,
                src/iaso/verify/pytest_plugin.py]
  workers: 2  # pytest-xdist (a dev dependency): the cap iaso's rules allow
judgment:
  backend: jev
  jev:
    provider: openrouter
    model: typesafe/jev-1.13
    credential_env: OPENROUTER_API_KEY
auto_approve:
  enabled: true
  backend: jev
  min_probability: 0.9
  min_confidence: high
freeze:   # SR-380: asleep (Codex and Hermes are not frozen: owner, 2026-11-03)
  - src/iaso/evaluate
  - tests/evaluate
  - .iaso/eval
