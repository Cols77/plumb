# SR: trailer policy (plumb trailers check-msg, plumb claims check).
require_trailer: true
# Extra exempt globs (the defaults .plumb/**, docs/**, .claude/**, uv.lock, .gitignore and
# .gitattributes always apply).
exempt: [CLAUDE.md, README.md]   # CLAUDE.md: written by plumb hooks install, like .claude/**; README.md: documentation, like docs/**
# NC-backed baseline of undeclared paths; it may only shrink: [{commit, path, nc}]
baseline:
- {commit: e4105c9, path: tests/importer/test_claims.py, nc: NC-0002}
- {commit: 3a02f02, path: tests/importer/test_claims.py, nc: NC-0002}
- {commit: 7367172, path: src/plumb/hosts/claude_code/templates/SKILL.md, nc: NC-0001}
